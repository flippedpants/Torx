name: torx release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
      
    runs-on: ${{matrix.os}}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with: 
          targets: ${{matrix.target}}
        
      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --locked --release --target ${{matrix.target}}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../torx-${{ matrix.target }}.tar.gz torx
          cd ../../../
          shasum -a 256 torx-${{ matrix.target }}.tar.gz > torx-${{ matrix.target }}.tar.gz.sha256

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path torx.exe -DestinationPath ../../../torx-${{ matrix.target }}.zip
          cd ../../../
          $hash = Get-FileHash torx-${{ matrix.target }}.zip -Algorithm SHA256
          $hash.Hash | Out-File torx-${{ matrix.target }}.zip.sha256

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with: 
          name: binary-${{ matrix.target}}
          path: |
            torx-*.tar.gz
            torx-*.tar.gz.sha256
            torx-*.zip
            torx-*.zip.sha256
          
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          
      - name: Create github release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true 
