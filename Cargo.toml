[package]
name = "torx"
version = "0.3.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/flippedpants/Torx"

[dependencies]
bytes = "1.11.1"
clap = { version = "4.6.2", features = ["derive"] }
crossterm = "0.29.0"
memchr = "2.8.0"
rand = "0.10.1"
ratatui = "0.30.1"
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bencode = "0.2.4"
serde_bytes = "0.11.19"
sha1 = "0.11.0"
tokio = { version = "1.52.2", features = ["full"] }
tokio-util = "0.7.18"

[profile.release]
opt-level= "z"
strip=true
lto=true
codegen-units=1
