[package]
name = "torx"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.11.1"
memchr = "2.8.0"
rand = "0.10.1"
reqwest = { version = "0.13.3", features = ["blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bencode = "0.2.4"
serde_bytes = "0.11.19"
sha1 = "0.11.0"
tokio = { version = "1.52.2", features = ["full"] }
